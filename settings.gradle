pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()

        maven {
            url = 'https://maven.neoforged.net/releases'
        }

        maven {
            url = 'https://maven.fabricmc.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Sit'
include('common')
include('fabric')
include('neoforge')
